services:
  accessflow:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////var/lib/accessflow/accessflow.db
      ACCESSFLOW_BIND_HOST: 0.0.0.0
      ACCESSFLOW_PORT: 8765
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - accessflow-data:/var/lib/accessflow
      - ./config:/app/config:ro
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 90s
volumes:
  accessflow-data:
