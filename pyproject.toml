[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "accessflow"
version = "0.1.0"
description = "Deterministic Jira Service Management request triage and durable comment write-back"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "pydantic-settings>=2.7,<3", "fastapi>=0.115,<1", "starlette>=0.46,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
accessflow = "accessflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
